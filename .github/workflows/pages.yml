name: Publish research desk

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC 01:00 = Hong Kong 09:00. GitHub may queue scheduled runs.
    - cron: '0 1 * * *'

permissions:
  contents: read

concurrency:
  group: public-research-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: Check source and refresh public data
        run: |
          pnpm typecheck
          pnpm test
          pnpm update:data
      - name: Save public data history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/workbench.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public research data'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        id: pages
      - name: Package source and build public website
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          pnpm package:source
          pnpm build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
